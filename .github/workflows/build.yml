name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Garij.sln

      - name: Build
        run: dotnet build Garij.sln --no-restore --configuration Release

      # Run Unit Tests separately
      - name: Test Unit Tests
        run: dotnet test tests/Garij.UnitTests/Garij.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx"

      # Run Integration Tests separately
      - name: Test Integration Tests
        run: dotnet test tests/Garij.IntegrationTests/Garij.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-tests.trx"

      # Run General Tests separately
      - name: Test General Tests
        run: dotnet test tests/Garij.Tests/Garij.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=garij-tests.trx"

      # Upload test results even if a test fails
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn
