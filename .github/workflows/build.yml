name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Garij.sln

      - name: Build
        run: dotnet build Garij.sln --no-restore --configuration Release

      - name: Test Unit Tests
        run: dotnet test tests/Garij.UnitTests/Garij.UnitTests.csproj --no-build --configuration Release --verbosity normal

      - name: Test Integration Tests
        run: dotnet test tests/Garij.IntegrationTests/Garij.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

      - name: Test General Tests
        run: dotnet test tests/Garij.Tests/Garij.Tests.csproj --no-build --configuration Release --verbosity normal
